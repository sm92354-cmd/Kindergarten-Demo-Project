server {
    listen 80;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Student Service
    location /api/students/ {
        proxy_pass http://studentservice:5001/;
    }

    # Teacher Service
    location /api/teachers/ {
        proxy_pass http://teacherservice:5002/;
    }

    # Employee Service
    location /api/employees/ {
        proxy_pass http://employeeservice:5003/;
    }

    # Profile Service - Avatar
    location /profile/ {
        proxy_pass http://profileservice:5004;
    }

    # Profile Service - Photos
    location /photos/ {
        proxy_pass http://profileservice:5004;
    }
}