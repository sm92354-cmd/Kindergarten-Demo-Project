services:
  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: kindergarten
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2-20
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "8081:8081"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  object-storage:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

  # Student Service
  studentservice:
    build:
      context: ./studentservice
    ports:
      - "5001:5001"
    env_file:
      - ./studentservice/.env
    depends_on:
      mongo:
        condition: service_healthy

  # Teacher Service
  teacherservice:
    build:
      context: ./teacherservice
    ports:
      - "5002:5002"
    env_file:
      - ./teacherservice/.env
    depends_on:
      mongo:
        condition: service_healthy

  # Employee Service
  employeeservice:
    build:
      context: ./employeeservice
    ports:
      - "5003:5003"
    env_file:
      - ./employeeservice/.env
    depends_on:
      mongo:
        condition: service_healthy

  # Profile Service
  profileservice:
    build:
      context: ./profileservice
    ports:
      - "5004:5004"
    env_file:
      - ./profileservice/.env
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  # Thumbnail Worker
  thumbnailworker:
    build:
      context: ./thumbnailworker
    env_file:
      - ./thumbnailworker/.env
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy



volumes:
  mongo-data:
  object-storage-data:
  rabbitmq-data:
